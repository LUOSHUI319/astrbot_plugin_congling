<!DOCTYPE html>
<html lang="zh-CN" data-ui="night">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <link rel="stylesheet" href="./style.1029c.css?v=16" />
  <link rel="stylesheet" href="./theme-v6.1029c.css?v=16" />
  <!-- 两套皮肤都挂着，靠 link.disabled 互斥，切换时不闪 -->
  <link rel="stylesheet" href="./night.1029c.css?v=16" id="cg-skin-night" />
  <link rel="stylesheet" href="./night-light.1031.css?v=16" id="cg-skin-day" />
  <link rel="stylesheet" href="./skin-switch.1031.css?v=16" />
  <link rel="stylesheet" href="./diarybook.css?v=16" />
  <script>
    /* 首屏定皮肤：必须在 CSS 之后、body 之前跑，否则会先闪一下深色 */
    (function () {
      try {
        var s = new URLSearchParams(location.search).get("skin") || localStorage.getItem("congling.skin") || "day";
        if (s !== "day" && s !== "night") s = "day";
        document.documentElement.dataset.skin = s;
        var d = document.getElementById("cg-skin-night");
        var l = document.getElementById("cg-skin-day");
        if (d) d.disabled = s !== "night";
        if (l) l.disabled = s !== "day";
      } catch (e) {}
    })();
  </script>
  <script>
    /* 桌面面板只管桌面，手机端交给 mobile.html。这里只做「把手机送过去」这一件事：
       - ?to=mobile  强制进手机版（手机版那边点「桌面面板」会带 ?desk=1 回来）
       - ?desk=1     强制留在桌面版，不再往回踢（手机版里「打开完整桌面面板」用的就是它）
       - 手机 UA / 手指操作的窄屏 → 自动进手机版
       注：AstrBot 给插件页发的响应带 Referrer-Policy: no-referrer，document.referrer 拿不到
       值，所以两边来回弹不靠 referrer 判断，靠 desk=1 这个显式开关。 */
    (function () {
      try {
        var q = new URLSearchParams(location.search);
        if (q.get("desk") === "1") return;
        var toMobile = q.get("to") === "mobile";
        if (!toMobile) {
          var ua = navigator.userAgent || "";
          var phone = /Android|iPhone|iPad|iPod|HarmonyOS|Mobile|Windows Phone/i.test(ua);
          var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
          var narrow = (window.innerWidth || document.documentElement.clientWidth || 0) <= 900;
          if (!phone && !(coarse && narrow)) return;
        }
        var out = "./mobile.html";
        if (q.get("skin") === "day" || q.get("skin") === "night") out += "?skin=" + q.get("skin");
        location.replace(out);
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div id="build-tag" style="position:fixed;left:6px;bottom:4px;z-index:99999;font:10px/1 ui-monospace,Consolas,monospace;color:#8fa89b;opacity:.55;pointer-events:none">build v16</div>

  <div class="app">
    <aside class="side">
      <div class="brand">
        <span class="brand-row">
          <span class="brand-mark" aria-hidden="true">
            <img src="./logo.png?v=16" alt="" />
          </span>
          <span class="brand-cn">从绫开始</span>
        </span>
        <span class="brand-en">congling</span>
        <span class="brand-ver" title="当前版本">1.1.1 · 测试版</span>
      </div>
      <nav id="nav">
        <button class="nav-item is-active" data-view="overview" data-short="概览">概览</button>
        <button class="nav-item" data-view="changelog" data-short="更新">更新日志</button>
        <button class="nav-item" data-view="persona" data-short="人格">人格</button>
        <button class="nav-item" data-view="behavior" data-short="行为">行为</button>
        <button class="nav-item" data-view="memory" data-short="记忆">记忆</button>
        <button class="nav-item" data-view="starmap" data-short="星图">记忆星图</button>
        <button class="nav-item" data-view="night" data-short="长夜">长夜</button>
        <button class="nav-item" data-view="diary" data-short="日记">日记</button>
        <button class="nav-item" data-view="tools" data-short="工具">工具</button>
        <button class="nav-item" data-view="qq" data-short="QQ">QQ</button>
        <button class="nav-item" data-view="system" data-short="系统">系统</button>
      </nav>
      <div class="side-foot">
        <button class="group-card" id="group-card" type="button" title="点一下复制群号">
          <span class="group-card-label">官方交流群</span>
          <span class="group-card-num">577084969<br>951213204</span>
          <span class="group-card-hint">有问题来群里喊</span>
        </button>
        <div id="compat-line" class="mono">探测中…</div>
      </div>
    </aside>

    <main class="main">
      <header class="head">
        <h1 id="title">概览</h1>
        <div class="head-right">
          <div class="picker" id="font-picker" title="字体">
            <button class="picker-btn picker-btn-font" aria-label="字体">字</button>
            <div class="picker-menu" id="font-menu"></div>
          </div>
          <span id="persona-tag" class="tag mono">—</span>
          <button id="refresh" class="ghost" title="刷新">刷新</button>
        </div>
      </header>
      <div id="subtabs" class="subtabs" hidden></div>
      <section id="view" class="view">
        <div class="empty">加载中…</div>
      </section>
    </main>
  </div>
  <!-- night.js 要先于 app.js 执行：app.js 的 render 会在这里找 nj* 函数 -->
  <script src="./night.1029c.js?v=16" defer></script>
  <script src="./app.1029c.js?v=16" defer></script>
  <script src="./skin-switch.1031.js?v=16" defer></script>

  <!-- 手机端专用界面（mobile.html）的唯一入口。
       桌面面板在手机上字小、按钮难点；手机进来一般会自动跳过去，这里是兜底入口。 -->
  <style>
    .mobile-entry {
      position: fixed;
      right: 12px;
      top: 12px;
      z-index: 9999;
      display: none;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 13px;
      border-radius: 999px;
      background: rgba(155, 196, 177, 0.16);
      border: 1px solid rgba(155, 196, 177, 0.42);
      color: #9bc4b1;
      font: 13px/1 "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
      text-decoration: none;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px -14px rgba(0, 0, 0, 0.8);
    }
    @media (max-width: 860px) {
      .mobile-entry { display: inline-flex; }
    }
  </style>
  <a class="mobile-entry" href="./mobile.html?v=16" title="打开手机版界面">手机版 ›</a>
</body>
</html>
