<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <link rel="stylesheet" href="./style.css?v=6" />
  <link rel="stylesheet" href="./theme-v6.css?v=6" />
  <!-- 夜航手账：全量皮肤，只在 data-ui="night" 时生效 -->
  <link rel="stylesheet" href="./night.css?v=20261027m" />
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <span class="brand-row">
          <span class="brand-mark" aria-hidden="true">
            <img src="./logo.png" alt="" />
          </span>
          <span class="brand-cn">从绫开始</span>
        </span>
        <span class="brand-en">congling</span>
      </div>
      <nav id="nav">
        <button class="nav-item is-active" data-view="overview">概览</button>
        <button class="nav-item" data-view="changelog">更新日志</button>
        <button class="nav-item" data-view="persona">人格</button>
        <button class="nav-item" data-view="behavior">行为</button>
        <button class="nav-item" data-view="memory">记忆</button>
        <button class="nav-item" data-view="night">长夜</button>
        <button class="nav-item" data-view="diary">日记</button>
        <button class="nav-item" data-view="tools">工具</button>
        <button class="nav-item" data-view="qq">QQ</button>
        <button class="nav-item" data-view="system">系统</button>
      </nav>
      <div class="side-foot">
        <button class="group-card" id="group-card" type="button" title="点一下复制群号">
          <span class="group-card-label">官方交流群</span>
          <span class="group-card-num">577084969</span>
          <span class="group-card-hint">有问题来群里喊</span>
        </button>
        <div id="compat-line" class="mono">探测中…</div>
      </div>
    </aside>

    <main class="main">
      <header class="head">
        <h1 id="title">概览</h1>
        <div class="head-right">
          <div class="picker" id="font-picker" title="字体">
            <button class="picker-btn picker-btn-font" aria-label="字体">字</button>
            <div class="picker-menu" id="font-menu"></div>
          </div>
          <span id="persona-tag" class="tag mono">—</span>
          <button id="refresh" class="ghost" title="刷新">刷新</button>
        </div>
      </header>
      <div id="subtabs" class="subtabs" hidden></div>
      <section id="view" class="view">
        <div class="empty">加载中…</div>
      </section>
    </main>
  </div>
  <!-- night.js 要先于 app.js 执行：app.js 的 render 会在这里找 nj* 函数 -->
  <script src="./night.js?v=20261027m" defer></script>
  <script src="./app.js?v=20261027m" defer></script>
</body>
</html>
