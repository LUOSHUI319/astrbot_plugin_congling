<!DOCTYPE html>
<html lang="zh-CN" data-skin="night">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#070d0a" id="m-theme-color" />
  <title>从绫开始 · 手机版</title>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <link rel="stylesheet" href="./mobile.css" />
  <script>
    /* 首屏定皮肤：跟桌面面板共用 congling.skin，没存过就看系统 */
    (function () {
      try {
        var s = new URLSearchParams(location.search).get("skin");
        if (!s) s = localStorage.getItem("congling.skin");
        if (!s) {
          s = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "day" : "night";
        }
        if (s !== "day" && s !== "night") s = "night";
        document.documentElement.dataset.skin = s;
      } catch (e) {
        document.documentElement.dataset.skin = "night";
      }
    })();
  </script>
</head>
<body>
  <!-- 图标：线性图标，统一 24 网格，stroke 由 CSS 控制 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" />
    </symbol>
    <symbol id="i-memory" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4a4 4 0 0 0-4 4v.4A3.6 3.6 0 0 0 5 12a3.6 3.6 0 0 0 1.4 2.9A3.5 3.5 0 0 0 12 20z" />
      <path d="M12 4a4 4 0 0 1 4 4v.4A3.6 3.6 0 0 1 19 12a3.6 3.6 0 0 1-1.4 2.9A3.5 3.5 0 0 1 12 20z" />
      <path d="M12 4v16" />
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" />
    </symbol>
    <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z" />
      <path d="M5 5.5v15" />
      <path d="M9 7.5h6M9 11h4" />
    </symbol>
    <symbol id="i-more" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="5" cy="12" r="1.6" />
      <circle cx="12" cy="12" r="1.6" />
      <circle cx="19" cy="12" r="1.6" />
    </symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 11a8 8 0 1 0-2.3 5.7" />
      <path d="M20 5v6h-6" />
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="6.5" />
      <path d="m16 16 4 4" />
    </symbol>
    <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5 13.8 9l5.5 1.8-5.5 1.8L12 18l-1.8-5.4L4.7 10.8 10.2 9z" />
    </symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="3.4" />
      <path d="M5.5 20a6.5 6.5 0 0 1 13 0" />
    </symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 6h14M5 12h14M5 18h14" />
      <circle cx="9" cy="6" r="2" />
      <circle cx="15" cy="12" r="2" />
      <circle cx="8" cy="18" r="2" />
    </symbol>
    <symbol id="i-tool" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 4.5a4 4 0 0 0 5 5L10 19a2.1 2.1 0 0 1-3-3z" />
      <path d="M14 5 19 10" />
    </symbol>
    <symbol id="i-qzone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8" />
      <path d="M12 8v4l3 2" />
    </symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 12h4l2.5-6 3.5 12 2.5-6H21" />
    </symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 5 7 7-7 7" />
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 6l12 12M18 6 6 18" />
    </symbol>
    <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20s-7-4.4-7-9.2A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.8C19 15.6 12 20 12 20z" />
    </symbol>
    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5.5" width="18" height="13" rx="2.5" />
      <path d="m4 7 8 6 8-6" />
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" />
    </symbol>
    <symbol id="i-desktop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4.5" width="18" height="12" rx="2" />
      <path d="M9 20h6M12 16.5V20" />
    </symbol>
  </svg>

  <div class="m-app" id="m-app">
    <header class="m-topbar">
      <button class="m-icon-btn m-hide" id="m-back" type="button" aria-label="返回">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7" /></svg>
      </button>
      <div class="m-brand" id="m-brand">
        <img src="./logo.png" alt="" />
        <span class="m-brand-txt">
          <span class="m-brand-name">从绫开始</span>
          <span class="m-brand-sub">congling · mobile</span>
        </span>
      </div>
      <h1 class="m-page-title m-hide" id="m-page-title">设置</h1>
      <span class="m-topbar-spacer"></span>
      <span class="m-pill" id="m-health"><span class="m-dot"></span><span id="m-health-text">连接中</span></span>
      <button class="m-icon-btn" id="m-theme" type="button" aria-label="切换日夜">
        <svg width="17" height="17"><use href="#i-moon" /></svg>
      </button>
      <button class="m-icon-btn" id="m-refresh" type="button" aria-label="刷新">
        <svg width="17" height="17"><use href="#i-refresh" /></svg>
      </button>
    </header>

    <div class="m-ptr" id="m-ptr"><span class="m-ptr-dot"></span><span id="m-ptr-text">下拉刷新</span></div>

    <main class="m-main" id="m-main">
      <div class="m-page"><div class="m-empty"><b>正在连上她</b>稍等一下…</div></div>
    </main>

    <nav class="m-tabbar" id="m-tabbar" aria-label="主导航">
      <button class="m-tab is-on" type="button" data-tab="home">
        <svg><use href="#i-home" /></svg><span>概览</span>
      </button>
      <button class="m-tab" type="button" data-tab="memory">
        <svg><use href="#i-memory" /></svg><span>记忆</span>
      </button>
      <button class="m-tab" type="button" data-tab="night">
        <svg><use href="#i-moon" /></svg><span>长夜</span>
        <i class="m-tab-badge m-hide" id="m-badge-night">0</i>
      </button>
      <button class="m-tab" type="button" data-tab="diary">
        <svg><use href="#i-book" /></svg><span>日记</span>
      </button>
      <button class="m-tab" type="button" data-tab="more">
        <svg><use href="#i-more" /></svg><span>更多</span>
      </button>
    </nav>
  </div>

  <div class="m-sheet-wrap" id="m-sheet-wrap" aria-hidden="true">
    <div class="m-sheet" role="dialog" aria-modal="true" aria-labelledby="m-sheet-title">
      <div class="m-sheet-grab"><span></span></div>
      <div class="m-sheet-head">
        <h3 id="m-sheet-title">—</h3>
        <div class="m-sheet-tools" id="m-sheet-tools"></div>
        <button class="m-icon-btn" id="m-sheet-close" type="button" aria-label="关闭">
          <svg width="15" height="15"><use href="#i-close" /></svg>
        </button>
      </div>
      <div class="m-sheet-body" id="m-sheet-body"></div>
      <div class="m-sheet-foot m-hide" id="m-sheet-foot"></div>
    </div>
  </div>

  <div class="m-toast-box" id="m-toast-box"></div>

  <!-- 设置页改动后浮起的保存条：放在 .m-app 之外的 body 层，避免被滚动容器裁掉 -->
  <div class="m-savedock m-hide" id="m-savedock">
    <button class="m-btn is-primary" type="button" data-act="settings-save">保存 <span id="m-dock-count"></span></button>
  </div>

  <script src="./mobile.js" defer></script>
</body>
</html>
